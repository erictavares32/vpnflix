name: Fetch Cybersecurity News

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: fetch-news-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Fetch news from API
        run: node fetch-news.js
      
      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add news-data.json

          if git diff --staged --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "chore: update cybersecurity news data"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "Could not rebase automatically because news-data.json conflicts with main."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Changes pushed successfully."
              exit 0
            fi

            echo "Push rejected; retrying..."
            sleep 5
          done

          echo "Failed to push after 3 attempts."
          exit 1
